# Packagist reads each version tag from this repository by itself, through its
# GitHub hook, so a release here only checks the tag and writes its GitHub
# release notes from CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the tag names the SDK's version
        run: |
          VERSION="$(sed -n "s/.*public const VERSION = '\([0-9.]*\)';.*/\1/p" src/Client.php)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Client::VERSION is $VERSION."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: GitHub release
        run: |
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
          printf '\nInstall: `composer require payments-lk/payments-lk-php:^%s`\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release for $GITHUB_REF_NAME exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "PHP $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
