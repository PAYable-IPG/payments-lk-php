# Lints and tests payments-lk/payments-lk-php on every supported PHP version, and validates
# composer.json. Only GitHub's own actions: each PHP version is the official
# php image, run after a normal git checkout on the runner, and Composer is the
# runner's own.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Lint and test
        run: |
          docker run --rm -v "$PWD:/sdk" -w /sdk "php:${{ matrix.php }}-cli" sh -c \
            'for f in $(find src tests -name "*.php"); do php -l "$f" > /dev/null || exit 1; done && php tests/run.php'

  composer:
    name: composer.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate
        run: composer validate --strict
